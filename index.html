<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>畝立て設計 | オオサカポテト</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* App shell: photo canvas is the hero; dark olive chrome keeps the aerial photo and the green/orange ridges as the brightest things on screen.
   Left rail = what you add. Right drawer = numbers. Top = where you are + lock. */
:root{
  --bg:#141a16; --panel:#1c241f; --panel2:#232d27; --line:#2d3b32; --fg:#eef2e8; --muted:#9fb0a3;
  --main:#34e07a; --head:#ffb129; --ditchA:#5cb3ff; --ditchB:#e879f9; --off:#7c8a80; --sel:#ffe14d;
  --accent:#34e07a; --accent-ink:#06301a; --warn:#ffb129; --danger:#ff6b6b; --field:#0f1411;
  --sans:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:12px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef1ea; --panel:#ffffff; --panel2:#f3f6f0; --line:#d5ddd3; --fg:#17201a; --muted:#5f6f64;
  --main:#148a3c; --head:#e07a00; --ditchA:#1b6fe0; --ditchB:#a21caf; --off:#8a9790; --sel:#e6b800;
  --accent:#148a3c; --accent-ink:#ffffff; --warn:#b4650a; --danger:#c62828; --field:#dfe5da; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef1ea; --panel:#ffffff; --panel2:#f3f6f0; --line:#d5ddd3; --fg:#17201a; --muted:#5f6f64;
  --main:#148a3c; --head:#e07a00; --ditchA:#1b6fe0; --ditchB:#a21caf; --off:#8a9790; --sel:#e6b800;
  --accent:#148a3c; --accent-ink:#ffffff; --warn:#b4650a; --danger:#c62828; --field:#dfe5da; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.45;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.top h1{flex:1 1 120px;font-size:18px;font-weight:700;margin:0;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tag{font-size:11px;color:var(--warn);border:1px solid currentColor;padding:1px 7px;border-radius:999px;white-space:nowrap}
.nav{margin-left:auto;display:flex;background:var(--panel2);border-radius:999px;padding:3px;gap:2px}
.nav button{font-size:13px;padding:6px 14px;border-radius:999px;color:var(--muted);white-space:nowrap}
@media (max-width:900px){.top{flex-wrap:wrap;gap:8px}.nav{margin-left:0;order:3;width:100%}.nav button{flex:1}#lock{margin-left:auto}}
.nav button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
#lock{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--fg);white-space:nowrap}
#lock[aria-pressed="true"]{background:var(--panel2);border-color:var(--muted)}
#lock[aria-pressed="false"]{background:var(--sel);color:#2a2200;border-color:var(--sel)}

/* shell */
.shell{display:grid;grid-template-columns:84px minmax(0,1fr) 320px;min-height:calc(100vh - 56px)}
.shell.reg{grid-template-columns:300px minmax(0,1fr)}
@media (max-width:900px){.shell,.shell.reg{grid-template-columns:1fr;min-height:0}}

/* left rail */
.rail{display:flex;flex-direction:column;gap:4px;padding:10px 8px;border-right:1px solid var(--line);background:var(--panel)}
.rail .sep{height:1px;background:var(--line);margin:6px 4px}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:10px;font-size:11px;line-height:1.15;white-space:nowrap;color:var(--muted);text-align:center}
.tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--accent)}
.tool.main{--c:var(--main)} .tool.head{--c:var(--head)} .tool.dA{--c:var(--ditchA)} .tool.dB{--c:var(--ditchB)}
.tool.main svg,.tool.head svg,.tool.dA svg,.tool.dB svg{stroke:var(--c)}
.tool.danger:not(:disabled){color:var(--danger)}
@media (max-width:900px){.rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}.rail .sep{width:1px;height:auto;margin:4px 2px}.tool{min-width:62px}}

/* canvas */
.stage{position:relative;background:var(--field);min-width:0;display:flex;flex-direction:column}
.mapwrap{position:relative;flex:1;min-height:420px;height:calc(100vh - 140px);max-height:calc(100vh - 100px)}
@media (max-width:900px){.mapwrap{height:62vh;min-height:360px}}
.gmap{position:absolute;inset:0;background:var(--field)}
.ov{position:absolute;overflow:visible;pointer-events:none}
.ov .hit{pointer-events:auto}
.savebar{position:absolute;right:12px;bottom:12px;z-index:2;font-size:12px;font-family:var(--mono);background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:5px 10px;border-radius:8px}
.savebar.busy{color:var(--warn)} .savebar.err{color:var(--danger);border-color:var(--danger)}
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.login .box{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.login h2{margin:0 0 6px;font-size:20px}
.login p{color:var(--muted);font-size:13px;margin:0 0 14px}
.login input[type=text]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.login button{margin-top:12px;width:100%;padding:11px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px}
.login .err{color:var(--danger);font-size:13px;min-height:1.4em;margin-top:8px}
.srch{display:flex;gap:6px;margin:8px 0}
.srch input{flex:1;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.srch button{padding:8px 12px;border-radius:8px;background:var(--panel2);color:var(--fg)}
.addf{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.addf input{font:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-width:0}
.addf button{padding:7px 10px;border-radius:8px;background:var(--panel2);color:var(--fg);white-space:nowrap}
#logout{font-size:12px;color:var(--muted);padding:4px 8px}
.hint{position:absolute;left:12px;right:12px;top:10px;z-index:2;font-size:13px;background:rgba(20,26,22,.82);color:#fff;padding:7px 12px;border-radius:8px;backdrop-filter:blur(6px);pointer-events:none;min-height:1.5em}
:root[data-theme="light"] .hint{background:rgba(255,255,255,.9);color:var(--fg)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .hint{background:rgba(255,255,255,.9);color:var(--fg)}}
.zoom{display:none;position:absolute;right:12px;bottom:12px;z-index:2;display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.zoom button{width:38px;height:36px;border-radius:7px;font-size:16px;font-family:var(--mono);color:var(--fg)}
.zoom button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.zoom button.txt{font-family:var(--sans);font-size:11px}
.view{position:absolute;left:12px;bottom:12px;z-index:2;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.view button{padding:7px 10px;border-radius:7px;font-size:12px;color:var(--muted)}
.view button[aria-pressed="true"]{background:var(--panel2);color:var(--fg)}
.areacheck{position:absolute;left:12px;right:12px;top:48px;z-index:2;font-size:12px;font-family:var(--mono);font-variant-numeric:tabular-nums;padding:5px 10px;border-radius:8px;background:rgba(52,224,122,.18);color:#dfffe9;pointer-events:none}
.areacheck:empty{display:none}
.areacheck.bad{background:rgba(255,177,41,.22);color:#ffe7b8}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .areacheck{color:#0b4a22}:root:not([data-theme="dark"]) .areacheck.bad{color:#6b3d00}}
:root[data-theme="light"] .areacheck{color:#0b4a22}:root[data-theme="light"] .areacheck.bad{color:#6b3d00}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:11px;color:var(--muted);padding:8px 14px;border-top:1px solid var(--line);background:var(--panel)}
.legend i{display:inline-block;width:16px;height:5px;vertical-align:2px;margin-right:5px;border-radius:3px}
.regbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.regbar #reg-name{font-weight:700;font-size:14px;flex:1;min-width:0}
.regbar button{padding:7px 12px;border-radius:8px;font-size:13px;background:var(--panel2);color:var(--fg)}
.regbar #save{background:var(--accent);color:var(--accent-ink);font-weight:700}
.note{font-size:12px;color:var(--muted);padding:8px 14px}

/* right drawer */
.drawer{border-left:1px solid var(--line);background:var(--panel);padding:12px 14px 24px;overflow:auto;min-width:0}
@media (max-width:900px){.drawer{border-left:0;border-top:1px solid var(--line)}}
.drawer h2{font-size:12px;color:var(--muted);font-weight:500;margin:14px 0 6px;display:flex;align-items:baseline;gap:8px}
.drawer h2:first-child{margin-top:0}
.drawer h2 b{font-size:14px;color:var(--fg);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--panel2);padding:8px 10px}
.stat b{display:block;font-family:var(--mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{font-size:10.5px;color:var(--muted);display:block;margin-top:2px}
.stat.k b{color:var(--main)} .stat.h b{color:var(--head)} .stat.d b{color:var(--ditchA)}
.field{display:grid;grid-template-columns:1fr 92px;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.field.wide{grid-template-columns:1fr}
.field:last-child{border-bottom:0}
.field label{font-size:13px}
.field small{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.field .in{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
input[type=number]{width:100%;font:inherit;font-family:var(--mono);font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);text-align:right}
input[type=number]:disabled{opacity:.45}
input[type=search]{width:100%;font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);margin-bottom:8px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;font-size:12.5px;padding:7px 6px;border-radius:8px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg button#z-rect,.seg button#snap{color:var(--fg)}
.zlist{display:flex;flex-direction:column;gap:6px}
.zrow{display:grid;grid-template-columns:6px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--panel2);cursor:pointer;font-size:13px}
.zrow[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--sel)}
.zrow .sw{width:6px;height:100%;min-height:28px;border-radius:3px}
.zrow .m{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.zrow small{color:var(--muted);font-size:11px}
.ridge-table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.ridge-table th,.ridge-table td{text-align:right;padding:4px 8px;border-bottom:1px solid var(--line);font-family:var(--mono)}
.ridge-table th{font-family:var(--sans);font-weight:500;color:var(--muted);position:sticky;top:0;background:var(--panel)}
.ridge-table td:first-child,.ridge-table th:first-child{text-align:left}
.ridge-table tr.skip td{color:var(--muted);text-decoration:line-through}
.ridge-table tr.z td{font-family:var(--sans);font-weight:700;background:var(--panel2)}
.tblwrap{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.flist{overflow:auto;border-radius:10px;border:1px solid var(--line);max-height:calc(100vh - 150px)}
.flist .g{font-size:11px;color:var(--muted);padding:8px 10px 3px;background:var(--panel);position:sticky;top:0}
.flist button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;font-size:13.5px;padding:9px 10px;border-bottom:1px solid var(--line);color:var(--fg)}
.flist button[aria-pressed="true"]{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
.flist button .a{font-family:var(--mono);color:var(--muted);white-space:nowrap;font-size:12px}
.flist button .ok{color:var(--main);font-size:11px;margin-left:6px}
.side{padding:12px;border-right:1px solid var(--line);background:var(--panel)}
@media (max-width:900px){.side{border-right:0;border-bottom:1px solid var(--line)}.flist{max-height:40vh}}
#map.draw{cursor:crosshair}
.skip-note{font-size:11.5px;color:var(--muted);margin:8px 0 0}
</style>

</head>
<body>

<div class="login" id="login" hidden><div class="box">
  <h2>🌱 畝立て設計</h2>
  <p>名前を入れてください（この端末に記憶されます）</p>
  <input type="text" id="lgUser" placeholder="名前" autocomplete="off">
  <button type="button" id="lgBtn">はじめる</button>
  <div class="err" id="lgErr"></div>
</div></div>

<header class="top">
  <h1 id="title">圃場登録</h1>
  <button type="button" id="lock" aria-pressed="true" hidden>🔒 ロック中</button>
  <nav class="nav"><button type="button" id="nav-reg" aria-pressed="true">圃場登録</button><button type="button" id="nav-design" aria-pressed="false" disabled>畝立て設計</button></nav>
  <button type="button" id="logout" title="名前を変える">👤 <span id="meName"></span></button>
</header>

<div id="scr-reg">
<div class="shell reg">
<aside class="side">
  <input type="search" id="q" placeholder="圃場名で絞る" autocomplete="off">
  <div class="flist" id="flist"></div>
  <div class="addf"><input type="text" id="nfName" placeholder="新しい圃場名"><input type="number" id="nfArea" placeholder="面積a" step="0.1" style="width:80px"><button type="button" id="nfAdd">追加</button></div>
</aside>
<section class="stage">
  <div class="regbar">
    <span id="reg-name"></span>
    <button type="button" id="undo">一つ戻す</button>
    <button type="button" id="clear">やり直し</button>
    <button type="button" id="save" disabled>保存して設計へ</button>
  </div>
  <div class="srch"><input type="text" id="addr" placeholder="住所や地名で地図を移動（例：富田林市 〇〇町）"><button type="button" id="addrGo">移動</button><button type="button" id="gps" title="今いる場所へ">📍</button></div>
  <div class="mapwrap">
    <p class="hint" id="reg-hint"></p>
    <p class="areacheck" id="reg-area"></p>
    <div id="map" class="gmap"></div>
  </div>
</section>
</div>
</div>

<div id="scr-design" hidden>
<div class="shell">
<nav class="rail" aria-label="道具">
  <button type="button" class="tool main" id="m-main" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 15h16M4 20h16"/></svg>本畝</button>
  <button type="button" class="tool head" id="m-head" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15 4v16M20 4v16"/></svg>枕畝</button>
  <div class="sep"></div>
  <button type="button" class="tool dA" id="m-dA" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 12c3-4 6 4 9 0s6 4 9 0"/></svg>明渠<br>畝立て前</button>
  <button type="button" class="tool dB" id="m-dB" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 12c3-4 6 4 9 0s6 4 9 0" stroke-dasharray="3 3"/></svg>明渠<br>畝立て後</button>
  <button type="button" class="tool" id="d-done" hidden><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>線を確定</button>
  <div class="sep"></div>
  <button type="button" class="tool" id="m-ridge" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h7M4 17h16"/><path d="M14 12h6" stroke-dasharray="2 2"/></svg>畝<br>オン/オフ</button>
  <button type="button" class="tool" id="snap" aria-pressed="true" title="枠の幅をピッチで割り切れる一番近い値に自動で寄せる"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 18h16M8 6v12M16 6v12"/></svg>ピッチ<br>合わせ</button>
  <div class="sep"></div>
  <button type="button" class="tool danger" id="del" disabled><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg>選択を削除</button>
  <button type="button" class="tool danger" id="reset"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.3M4 4v5h5"/></svg>全部消す</button>
</nav>

<section class="stage">
  <div class="mapwrap">
    <p class="hint" id="hint"></p>
    <div id="plan" class="gmap"></div>
    <div class="view"><button type="button" id="labels" aria-pressed="true">m表示</button><button type="button" id="fit-field" class="txt">圃場へ</button></div>
    <div class="savebar" id="savebar"></div>
  </div>
  <div class="legend">
    <span><i style="background:var(--main)"></i>本畝</span>
    <span><i style="background:var(--head)"></i>枕畝</span>
    <span><i style="background:var(--off)"></i>立てない畝</span>
    <span><i style="background:var(--ditchA)"></i>明渠 畝立て前</span>
    <span><i style="background:var(--ditchB)"></i>明渠 畝立て後</span>
    <span><i style="background:var(--sel)"></i>選択中</span>
  </div>
</section>

<aside class="drawer">
  <h2><b>数量</b></h2>
  <div class="stats">
    <div class="stat"><b id="s-area">–</b><span>面積 a</span></div>
    <div class="stat k"><b id="s-n">–</b><span>本畝 本</span></div>
    <div class="stat k"><b id="s-len">–</b><span>本畝 m</span></div>
    <div class="stat h"><b id="s-hn">–</b><span>枕畝 本</span></div>
    <div class="stat h"><b id="s-hlen">–</b><span>枕畝 m</span></div>
    <div class="stat d"><b id="s-ditch">–</b><span>明渠 m</span></div>
    <div class="stat"><b id="s-mulch">–</b><span>マルチ 200m巻</span></div>
    <div class="stat"><b id="s-plants">–</b><span>苗 本</span></div>
    <div class="stat"><b id="s-fert">–</b><span>基肥 kg</span></div>
  </div>
  <p class="skip-note" id="skipnote"></p>

  <h2><b>畝のまとまり</b><span>タップで選択</span></h2>
  <div class="zlist" id="zlist"></div>
  <div id="zedit" hidden>
    <div class="field wide" style="padding-top:10px"><div class="seg"><button type="button" id="z-rect">四角に揃える</button></div><small style="color:var(--muted);font-size:11px;margin-top:4px">3・4点を1→2辺と直角に動かす</small></div>
    <div class="field wide"><label>畝立て機<small id="w-note"></small></label>
      <div class="seg" id="machine"><button type="button" data-m="futago">ふたごちゃん</button><button type="button" data-m="koune">こうねちゃん</button><button type="button" data-m="daichi">だい地くん</button></div></div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbzVVr8ECkoex4-V2bQz1qeFiucON0LiAcH8lcAlPry-wsxuL9pepXLQSjZEVwZ7SAiCuw/exec';

const HOME={lat:34.620,lng:135.600}; // 八尾あたり。圃場が未登録のときの初期位置
const MACHINES={futago:{w:45,p:45,lock:true,note:'ふたごちゃん：畝幅45／通路45 固定'},koune:{w:45,p:45,lock:false,note:'こうねちゃん：数値は要確認（編集可）'},daichi:{w:90,p:35,lock:false,note:'だい地くん（玉ねぎ）：天90cm／通路35cm、マルチ1500mm（編集可）'}};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ===== API =====
let ME='';
async function api(action,payload){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({user:ME,key:'',action,payload})});
  const j=await r.json(); if(!j.ok){ if(j.authFailed) showLogin(j.error); throw new Error(j.error||'エラー'); } return j.result;
}
function showLogin(msg){ $('login').hidden=false; $('lgErr').textContent=msg||''; $('lgUser').value=ME||localStorage.getItem('une_user')||''; }
$('lgBtn').onclick=async()=>{ const n=$('lgUser').value.trim(); if(!n){ $('lgErr').textContent='名前を入れてください'; return; } ME=n; localStorage.setItem('une_user',n); $('login').hidden=true; $('meName').textContent=ME; await boot(); };
$('lgUser').addEventListener('keydown',e=>{ if(e.key==='Enter') $('lgBtn').click(); });
$('logout').onclick=()=>showLogin('');

// ===== 座標：緯度経度 ⇄ ローカルm（x=東, y=南）。原点は圃場ごと =====
let ORIGIN=null; // {lat,lng}
const R_E=6378137;
function toLocal(ll){ const lat0=ORIGIN.lat*Math.PI/180; return [ (ll.lng-ORIGIN.lng)*Math.PI/180*R_E*Math.cos(lat0), -(ll.lat-ORIGIN.lat)*Math.PI/180*R_E ]; }
function toLatLng([x,y]){ const lat0=ORIGIN.lat*Math.PI/180; return {lat:ORIGIN.lat - y/R_E*180/Math.PI, lng:ORIGIN.lng + x/(R_E*Math.cos(lat0))*180/Math.PI}; }
function centroidLL(pts){ let a=0,b=0; pts.forEach(p=>{a+=p[0];b+=p[1];}); return {lat:a/pts.length,lng:b/pts.length}; }

// ===== SVGオーバーレイ（Googleマップの上に描く。マップのdivピクセルで座標を取る）=====
function makeOverlay(map, onDraw){
  const ov=new google.maps.OverlayView(); let svg=null;
  ov.onAdd=function(){ svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('class','ov'); this.getPanes().overlayMouseTarget.appendChild(svg); };
  ov.onRemove=function(){ if(svg&&svg.parentNode) svg.parentNode.removeChild(svg); svg=null; };
  ov.draw=function(){ if(!svg) return; if(!ORIGIN){ svg.innerHTML=''; return; } const pr=this.getProjection(); if(!pr) return; const b=map.getBounds(); if(!b) return;
    const sw=pr.fromLatLngToDivPixel(b.getSouthWest()), ne=pr.fromLatLngToDivPixel(b.getNorthEast());
    const L=Math.min(sw.x,ne.x)-200, T=Math.min(sw.y,ne.y)-200, W=Math.abs(ne.x-sw.x)+400, H=Math.abs(sw.y-ne.y)+400;
    svg.style.left=L+'px'; svg.style.top=T+'px'; svg.setAttribute('width',W); svg.setAttribute('height',H); svg.setAttribute('viewBox',`${L} ${T} ${W} ${H}`);
    const X=x=>{ const p=pr.fromLatLngToDivPixel(new google.maps.LatLng(toLatLng([x,0]))); return p.x; };
    const P=(x,y)=>{ const p=pr.fromLatLngToDivPixel(new google.maps.LatLng(toLatLng([x,y]))); return [p.x,p.y]; };
    const p0=P(0,0), p1=P(1,0); const k=Math.hypot(p1[0]-p0[0],p1[1]-p0[1]); // px per m
    svg.innerHTML=onDraw({P,k,pr});
  };
  ov.setMap(map); ov.svgEl=()=>svg; ov.redraw=()=>ov.draw(); return ov;
}
// 地名：行政区（市町村・町名）と道路だけ残す。店・施設・水系のラベルは消す
const LABEL_STYLE=[
  {featureType:'poi',stylers:[{visibility:'off'}]},
  {featureType:'transit',stylers:[{visibility:'off'}]},
  {featureType:'water',elementType:'labels',stylers:[{visibility:'off'}]},
  {featureType:'landscape',elementType:'labels',stylers:[{visibility:'off'}]},
  {featureType:'administrative',elementType:'labels',stylers:[{visibility:'on'}]},
  {featureType:'road',elementType:'labels',stylers:[{visibility:'on'}]},
];
function mapOpts(center,zoom,labels){ return {center,zoom,mapTypeId:labels?'hybrid':'satellite',styles:LABEL_STYLE,tilt:0,disableDefaultUI:true,zoomControl:true,gestureHandling:'greedy',clickableIcons:false,keyboardShortcuts:false,rotateControl:false,mapTypeControl:true,mapTypeControlOptions:{mapTypeIds:['hybrid','satellite'],position:google.maps.ControlPosition.TOP_RIGHT}}; }

// ===== 画面 =====
let FIELDS=[], DESIGNED={}, SETTINGS={}, regSel=null, pts=[]; // pts: 登録画面の外周（ローカルm）
let regMap=null, regOv=null, planMap=null, planOv=null;
function showScreen(k){ $('scr-reg').hidden=k!=='reg'; $('scr-design').hidden=k!=='design'; $('lock').hidden=k!=='design'; $('nav-reg').setAttribute('aria-pressed',k==='reg'); $('nav-design').setAttribute('aria-pressed',k==='design'); $('title').textContent=k==='reg'?'圃場登録':((regSel?regSel.n:'')+'　畝立て設計図');
  setTimeout(()=>{ if(k==='reg'&&regMap) google.maps.event.trigger(regMap,'resize'); if(k==='design'&&planMap){ google.maps.event.trigger(planMap,'resize'); planOv&&planOv.redraw(); } },50); }
$('nav-reg').onclick=()=>showScreen('reg');
$('nav-design').onclick=()=>showScreen('design');

async function boot(){
  try{ const d=await api('init',{}); FIELDS=d.fields; DESIGNED=d.designed||{}; SETTINGS=d.settings||{}; }catch(e){ $('lgErr').textContent=e.message; showLogin(e.message); return; }
  if(SETTINGS['株間cm']) $('sp').value=SETTINGS['株間cm']; if(SETTINGS['基肥kg_10a']) $('fert').value=SETTINGS['基肥kg_10a']; if(SETTINGS['明渠幅cm']) $('dw').value=SETTINGS['明渠幅cm'];
  renderList();
  if(!regMap){ regMap=new google.maps.Map($('map'),mapOpts(HOME,16,true)); regOv=makeOverlay(regMap,drawReg);
    regMap.addListener('click',e=>{ if(!regSel||regDragging) return; if(!ORIGIN) ORIGIN={lat:e.latLng.lat(),lng:e.latLng.lng()}; pts.push(toLocal({lat:e.latLng.lat(),lng:e.latLng.lng()})); updateReg(); });
    // 外周の点をドラッグ
    attachDrag($('map'),regMap,()=>regOv,(el)=>{ const p=el.closest('.rpt'); return p?{i:+p.dataset.i}:null; },(d,ll)=>{ pts[d.i]=toLocal(ll); updateReg(); },()=>{ regDragging=false; }); }
  showScreen('reg');
}
let regDragging=false;
// 共通：オーバーレイ上のハンドルをドラッグ。ドラッグ中はマップを動かさない
function attachDrag(div,map,getOv,hitTest,onMove,onEnd){
  let drag=null;
  div.addEventListener('pointerdown',e=>{ const t=e.target; if(!(t instanceof Element)) return; const h=hitTest(t); if(!h) return; drag=h; regDragging=true; map.setOptions({draggable:false,gestureHandling:'none'}); e.preventDefault(); e.stopPropagation(); },true);
  div.addEventListener('pointermove',e=>{ if(!drag) return; const ll=pixelToLatLng(map,getOv(),div,e); if(ll) onMove(drag,ll); e.preventDefault(); e.stopPropagation(); },true);
  const end=e=>{ if(!drag) return; drag=null; map.setOptions({draggable:true,gestureHandling:'greedy'}); setTimeout(()=>onEnd&&onEnd(),0); };
  div.addEventListener('pointerup',end,true); div.addEventListener('pointercancel',end,true);
}
function pixelToLatLng(map,ov,div,e){ const pr=ov.getProjection(); if(!pr) return null; const r=div.getBoundingClientRect(); const c=map.getCenter(); const cp=pr.fromLatLngToContainerPixel(c);
  const ll=pr.fromContainerPixelToLatLng(new google.maps.Point(e.clientX-r.left,e.clientY-r.top)); return {lat:ll.lat(),lng:ll.lng()}; }

// ===== 圃場登録 =====
function renderList(){
  const q=($('q').value||'').trim(); let html='',g=null;
  for(const f of FIELDS){ if(q&&!f.n.includes(q)) continue; if(f.g!==g){g=f.g; html+=`<div class="g">${esc(g)}</div>`;}
    html+=`<button type="button" data-id="${f.id}" aria-pressed="${regSel&&regSel.id===f.id}"><span>${esc(f.n)}${f.hasOutline?' <span class="ok">登録済</span>':''}${DESIGNED[f.id]?' <span class="ok">設計済</span>':''}</span><span class="a">${f.a.toFixed(2)}a</span></button>`; }
  $('flist').innerHTML=html;
  $('flist').querySelectorAll('button').forEach(b=>b.onclick=()=>selectField(+b.dataset.id));
}
$('q').addEventListener('input',renderList);
async function selectField(id){
  regSel=FIELDS.find(f=>f.id===id); renderList(); $('reg-name').textContent='読み込み中…';
  try{ const f=await api('getField',{fieldId:id}); regSel.full=f;
    if(f.outline&&f.outline.length>=3){ ORIGIN=centroidLL(f.outline); pts=f.outline.map(p=>toLocal({lat:p[0],lng:p[1]})); regMap.setCenter(ORIGIN); regMap.setZoom(18); }
    else { ORIGIN=null; pts=[]; if(f.lat&&f.lng){ regMap.setCenter({lat:+f.lat,lng:+f.lng}); regMap.setZoom(18); } }
    $('nav-design').disabled=!(f.outline&&f.outline.length>=3);
  }catch(e){ $('reg-name').textContent=e.message; }
  updateReg();
}
function updateReg(){
  $('reg-name').textContent=regSel?`${regSel.g}／${regSel.n}（アグリノート ${regSel.a.toFixed(2)}a）`:'圃場を選んでください';
  const el=$('reg-area');
  if(regSel&&pts.length>=3){ const a=Math.abs(area(pts))/100, d=a-regSel.a, pct=regSel.a?d/regSel.a*100:0; el.textContent=`面積照合：なぞった形 ${a.toFixed(2)}a ／ アグリノート ${regSel.a.toFixed(2)}a ／ 差 ${d>=0?'+':''}${d.toFixed(2)}a（${pct>=0?'+':''}${pct.toFixed(1)}%）`; el.className='areacheck'+(Math.abs(pct)>2?' bad':''); }
  else { el.textContent=regSel?`${pts.length}点（あと${Math.max(0,3-pts.length)}点で面積が出る）`:''; el.className='areacheck'; }
  $('save').disabled=!(regSel&&pts.length>=3);
  $('reg-hint').textContent=regSel?'航空写真で圃場の角を順にタップ。点はドラッグで直せる。':'左の一覧から圃場を選ぶ。地図は住所検索か📍で移動。';
  $('map').classList.toggle('draw',!!regSel);
  regOv&&regOv.redraw();
}
function drawReg({P,k}){
  if(!ORIGIN||!pts.length) return '';
  const Pt=pts.map(p=>P(p[0],p[1])); const S=Pt.map(q=>`${q[0].toFixed(1)},${q[1].toFixed(1)}`).join(' '); let s='';
  s+= pts.length>=3?`<polygon points="${S}" fill="rgba(220,60,30,.3)" stroke="#ff4d1f" stroke-width="2.5"/>`:`<polyline points="${S}" fill="none" stroke="#ff4d1f" stroke-width="2.5"/>`;
  for(let i=0;i<pts.length;i++){ const [x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length]; if(pts.length<3&&i===pts.length-1) break; const L=Math.hypot(x2-x1,y2-y1); const m=P((x1+x2)/2,(y1+y2)/2); s+=`<text x="${m[0].toFixed(1)}" y="${(m[1]+4).toFixed(1)}" font-size="11" text-anchor="middle" fill="#fff" font-family="var(--mono)" paint-order="stroke" stroke="#000" stroke-width="3">${L.toFixed(1)}m</text>`; }
  Pt.forEach((q,i)=>{ s+=`<circle class="rpt hit" data-i="${i}" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="9" fill="#ffd400" stroke="#fff" stroke-width="2" style="cursor:move"/>`; });
  return s;
}
$('undo').onclick=()=>{ pts.pop(); if(!pts.length) ORIGIN=null; updateReg(); };
$('clear').onclick=()=>{ pts=[]; ORIGIN=null; updateReg(); };
$('save').onclick=async()=>{ if(!regSel||pts.length<3) return; $('save').disabled=true; $('save').textContent='保存中…';
  try{ const outline=pts.map(p=>{ const ll=toLatLng(p); return [+ll.lat.toFixed(7),+ll.lng.toFixed(7)]; }); await api('saveOutline',{fieldId:regSel.id,outline});
    regSel.hasOutline=true; regSel.full=Object.assign(regSel.full||{},{outline}); renderList(); openDesign(regSel, outline, regSel.full.design, regSel.full.designVer||0);
  }catch(e){ alert('保存できませんでした：'+e.message); } finally{ $('save').textContent='保存して設計へ'; $('save').disabled=false; } };
$('addrGo').onclick=()=>{ const q=$('addr').value.trim(); if(!q) return; new google.maps.Geocoder().geocode({address:q,region:'jp'},(res,st)=>{ if(st==='OK'&&res[0]){ regMap.setCenter(res[0].geometry.location); regMap.setZoom(17); } else alert('見つかりませんでした'); }); };
$('addr').addEventListener('keydown',e=>{ if(e.key==='Enter') $('addrGo').click(); });
$('gps').onclick=()=>{ if(!navigator.geolocation) return; navigator.geolocation.getCurrentPosition(p=>{ regMap.setCenter({lat:p.coords.latitude,lng:p.coords.longitude}); regMap.setZoom(18); },()=>alert('位置情報が取れませんでした')); };
$('nfAdd').onclick=async()=>{ const name=$('nfName').value.trim(); if(!name) return; try{ const r=await api('addField',{name,area:+$('nfArea').value||0}); FIELDS.push({id:r.id,g:'その他',n:name,a:+$('nfArea').value||0,hasOutline:false}); $('nfName').value=''; $('nfArea').value=''; renderList(); selectField(r.id); }catch(e){ alert(e.message); } };
$('nav-design').addEventListener('click',()=>{ if(regSel&&regSel.full&&regSel.full.outline&&regSel.full.outline.length>=3&&designFieldId!==regSel.id) openDesign(regSel,regSel.full.outline,regSel.full.design,regSel.full.designVer||0); });

// ===== 畝立て設計 =====
let POLY=[], zones=[], ditches=[], mode='ridge', drawPts=[], selZ=-1, selD=-1, showLabels=true, snapOn=true, locked=true, designVer=0;
const MODES=['main','head','dA','dB','ridge'];
// ---- 幾何 ----
function area(poly){ let s=0; for(let i=0;i<poly.length;i++){const [x1,y1]=poly[i],[x2,y2]=poly[(i+1)%poly.length]; s+=x1*y2-x2*y1;} return s/2; }
function rot(poly,th){ const c=Math.cos(th),s=Math.sin(th); return poly.map(([x,y])=>[x*c-y*s,x*s+y*c]); }
function cutsH(poly,Y){ const xs=[]; for(let i=0;i<poly.length;i++){const [x1,y1]=poly[i],[x2,y2]=poly[(i+1)%poly.length]; if((y1<=Y&&y2>Y)||(y2<=Y&&y1>Y)) xs.push(x1+(Y-y1)*(x2-x1)/(y2-y1));} xs.sort((a,b)=>a-b); const o=[]; for(let i=0;i+1<xs.length;i+=2)o.push([xs[i],xs[i+1]]); return o; }
function intersectIv(A,B){ const o=[]; for(const [a1,a2] of A) for(const [b1,b2] of B){ const lo=Math.max(a1,b1),hi=Math.min(a2,b2); if(hi>lo) o.push([lo,hi]); } return o; }
function segX(p1,p2,q1,q2){ const den=(p1[0]-p2[0])*(q1[1]-q2[1])-(p1[1]-p2[1])*(q1[0]-q2[0]); if(Math.abs(den)<1e-12) return null; const t=((p1[0]-q1[0])*(q1[1]-q2[1])-(p1[1]-q1[1])*(q1[0]-q2[0]))/den, u=-((p1[0]-p2[0])*(p1[1]-q1[1])-(p1[1]-p2[1])*(p1[0]-q1[0]))/den; return (t>=0&&t<=1&&u>=0&&u<=1)?{t,u}:null; }
// 枠の幅をピッチで割り切れる一番近い値に寄せる：3・4点目を1→2辺の法線方向に動かす
function snapZone(z){
  const [p0,p1]=z.pts; const th=-(Math.atan2(p1[1]-p0[1],p1[0]-p0[0]) + z.ang*Math.PI/180);
  const Q=rot(z.pts,th); const w=z.w/100, pitch=(z.w+z.p)/100;
  const y12=(Q[0][1]+Q[1][1])/2, y34=(Q[2][1]+Q[3][1])/2; const span=Math.abs(y34-y12); if(span<w) return;
  const n=Math.max(1,Math.round((span-w)/pitch)+1); const want=w+(n-1)*pitch; const dy=(want-span)*Math.sign(y34-y12);
  Q[2][1]+=dy; Q[3][1]+=dy; const back=rot(Q,-th); z.pts[2]=back[2]; z.pts[3]=back[3];
}
const plen=pts=>{let s=0;for(let i=1;i<pts.length;i++)s+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);return s;};

// ---- 1つのまとまりの畝配置 ----
function layoutZone(z, minlen, sp, dwid){
  const [p0,p1]=z.pts; const th=-(Math.atan2(p1[1]-p0[1],p1[0]-p0[0]) + z.ang*Math.PI/180);
  const Q=rot(z.pts,th), F=rot(POLY,th); const w=z.w/100, pitch=(z.w+z.p)/100;
  const ys=Q.map(v=>v[1]); const ymin=Math.min(...ys), ymax=Math.max(...ys);
  // 1本目は「1→2の辺」に接して立て、余りは反対側（3→4の辺側）に出す。1→2辺が上下どちらかで並べる向きを決める
  const fromTop = Q[0][1] <= (ymin+ymax)/2;
  const span=ymax-ymin; const n=Math.max(0,Math.floor((span-w)/pitch+1e-9)+1); const rest=span-(w+(n-1)*pitch);
  const back=pt=>rot([pt],-th)[0];
  const ridges=[]; let col=0,no=0;
  for(let ci=0; ci<n; ci++){ const Y = fromTop ? ymin+w/2+ci*pitch : ymax-w/2-ci*pitch;
    col++;
    for(const [a,b] of intersectIv(cutsH(Q,Y),cutsH(F,Y))){
      const len=b-a; if(len<=0.05) continue;
      const P1=back([a,Y]),P2=back([b,Y]); const cuts=[];
      for(const d of ditches){ for(let i=0;i+1<d.pts.length;i++){ const x=segX(P1,P2,d.pts[i],d.pts[i+1]); if(!x) continue;
        const ux=(P2[0]-P1[0])/len,uy=(P2[1]-P1[1])/len; const dx=d.pts[i+1][0]-d.pts[i][0],dy=d.pts[i+1][1]-d.pts[i][1]; const dl=Math.hypot(dx,dy)||1e-9; const sin=Math.abs(ux*dy/dl-uy*dx/dl); const half=Math.min(len,(dwid/2)/Math.max(sin,0.2)); cuts.push([x.t*len-half,x.t*len+half]); } }
      cuts.sort((p,q)=>p[0]-q[0]); const pieces=[]; let cur=0;
      for(const [c1,c2] of cuts){ if(c1>cur) pieces.push([cur,Math.min(c1,len)]); cur=Math.max(cur,c2); } if(cur<len) pieces.push([cur,len]);
      const auto=minlen<=0||len>=minlen, ok=auto&&!z.off.has(col);
      ridges.push({col,no:ok?++no:null,len,ok,auto,pieces:pieces.filter(([s,e])=>e-s>0.05).map(([s,e])=>({p1:back([a+s,Y]),p2:back([a+e,Y]),len:e-s,plants:ok?Math.floor((e-s)/sp)+1:0}))});
    }
  }
  return {ridges,pitch,w,rest,n};
}



function rectZone(z){ const [p0,p1]=z.pts; const th=-(Math.atan2(p1[1]-p0[1],p1[0]-p0[0]) + z.ang*Math.PI/180); const Q=rot(z.pts,th);
  const y34=(Q[2][1]+Q[3][1])/2; Q[2]=[Q[1][0],y34]; Q[3]=[Q[0][0],y34]; const B=rot(Q,-th); z.pts[2]=B[2]; z.pts[3]=B[3]; }

function openDesign(field, outline, design, ver){
  regSel=field; designFieldId=field.id; ORIGIN=centroidLL(outline); POLY=outline.map(p=>toLocal({lat:p[0],lng:p[1]}));
  zones=[]; ditches=[]; designVer=ver||0;
  if(design&&design.zones){ zones=design.zones.map(z=>({...z,off:new Set(z.off||[])})); ditches=design.ditches||[]; if(design.snapOn!==undefined) snapOn=!!design.snapOn; }
  locked=!!(design&&design.zones&&design.zones.length); drawPts=[]; selZ=selD=-1; mode=locked?'ridge':'main';
  $('nav-design').disabled=false; showScreen('design');
  if(!planMap){ planMap=new google.maps.Map($('plan'),mapOpts(ORIGIN,18,true)); planOv=makeOverlay(planMap,drawPlan);
    planMap.addListener('click',e=>{ if(planDragging) return; const pm=toLocal({lat:e.latLng.lat(),lng:e.latLng.lng()}); onMapTap(pm,null); });
    attachDrag($('plan'),planMap,()=>planOv,(el)=>{ if(locked) return null; const z=el.closest('.zpt'), d=el.closest('.dpt'); if(z) return {type:'z',z:+z.dataset.z,i:+z.dataset.i}; if(d) return {type:'d',d:+d.dataset.d,i:+d.dataset.i}; return null; },
      (dr,ll)=>{ planDragging=true; const pm=toLocal(ll); if(dr.type==='z'){ zones[dr.z].pts[dr.i]=pm; selZ=dr.z; selD=-1; } else { ditches[dr.d].pts[dr.i]=pm; selD=dr.d; selZ=-1; } render(false); },
      ()=>{ planDragging=false; if(selZ>=0&&snapOn) snapZone(zones[selZ]); render(); });
    $('fit-field').onclick=fitField;
  } else { planMap.setCenter(ORIGIN); }
  fitField(); render(false);
}
let planDragging=false, hitAt=0, designFieldId=null;
document.addEventListener('pointerdown',e=>{ const t=e.target; if(t instanceof Element && t.closest('#plan') && t.closest('.hit')) hitAt=Date.now(); },true);
function fitField(){ const b=new google.maps.LatLngBounds(); POLY.forEach(p=>b.extend(toLatLng(p))); planMap.fitBounds(b,40); }
function onMapTap(pm,target){
  if((locked||mode==='ridge') && Date.now()-hitAt<500) return; // SVGの図形を押したタップ（選択・オンオフ）はそっちで処理済み
  if(locked){ selZ=selD=-1; return render(false); }
  if(mode==='main'||mode==='head'){ drawPts.push(pm); if(drawPts.length===4){ const nz={kind:mode,pts:drawPts,machine:'futago',w:45,p:45,ang:0,off:new Set()}; if(snapOn) snapZone(nz); zones.push(nz); selZ=zones.length-1; selD=-1; drawPts=[]; mode='ridge'; } return render(); }
  if(mode==='dA'||mode==='dB'){ drawPts.push(pm); return render(false); }
  selZ=selD=-1; render(false);
}
// SVG要素のタップ（マップのclickより先に捕まえる）
document.addEventListener('click',e=>{ const t=e.target; if(!(t instanceof Element)||!t.closest('#plan')) return; if(planDragging) return;
  if(locked){ const z=t.closest('.zone-hit'), d=t.closest('.ditch-hit'); if(z||d){ selZ=z?+z.dataset.i:-1; selD=d?+d.dataset.i:-1; render(false); e.stopPropagation(); } return; }
  if(mode!=='ridge') return; // 描画中はマップclickに任せる
  const r=t.closest('.ridge-hit'); if(r){ const zz=zones[+r.dataset.z]; const c=+r.dataset.col; zz.off.has(c)?zz.off.delete(c):zz.off.add(c); selZ=+r.dataset.z; selD=-1; render(); e.stopPropagation(); return; }
  const z=t.closest('.zone-hit'); if(z){ selZ=+z.dataset.i; selD=-1; render(false); e.stopPropagation(); return; }
  const d=t.closest('.ditch-hit'); if(d){ selD=+d.dataset.i; selZ=-1; render(false); e.stopPropagation(); return; }
},true);

['sp','fert','dw','minlen'].forEach(id=>$(id).addEventListener('input',()=>render(false)));
['w','p','zang'].forEach(id=>$(id).addEventListener('input',()=>{ const z=zones[selZ]; if(!z) return; z.w=+$('w').value; z.p=+$('p').value; z.ang=+$('zang').value; if(snapOn) snapZone(z); render(); }));
$('lock').onclick=()=>{ locked=!locked; drawPts=[]; mode='ridge'; render(false); };
$('z-rect').onclick=()=>{ const z=zones[selZ]; if(!z) return; rectZone(z); if(snapOn) snapZone(z); render(); };
$('snap').onclick=()=>{ snapOn=!snapOn; if(snapOn) zones.forEach(snapZone); render(); };
document.querySelectorAll('#machine button').forEach(b=>b.onclick=()=>{ const z=zones[selZ]; if(!z) return; z.machine=b.dataset.m; const m=MACHINES[z.machine]; z.w=m.w; z.p=m.p; if(snapOn) snapZone(z); render(); });
MODES.forEach(k=>$('m-'+k).onclick=()=>{ mode=k; drawPts=[]; render(false); });
$('d-done').onclick=()=>{ if(drawPts.length>=2){ ditches.push({when:mode==='dA'?'A':'B',pts:drawPts}); selD=ditches.length-1; selZ=-1; } drawPts=[]; mode='ridge'; render(); };
$('labels').onclick=()=>{ showLabels=!showLabels; render(false); };
$('del').onclick=()=>{ if(selZ>=0) zones.splice(selZ,1); else if(selD>=0) ditches.splice(selD,1); selZ=selD=-1; render(); };
$('reset').onclick=()=>{ if(!confirm('この圃場の設計を全部消しますか？')) return; zones=[]; ditches=[]; drawPts=[]; selZ=selD=-1; mode='ridge'; render(); };

// ===== 保存（変更のたびに1.5秒後にまとめて保存）=====
let saveTimer=null, saving=false, dirty=false;
function serDesign(){ return {zones:zones.map(z=>({...z,off:[...z.off]})),ditches,snapOn,origin:ORIGIN,savedAt:new Date().toISOString()}; }
function queueSave(){ dirty=true; $('savebar').textContent='未保存…'; $('savebar').className='savebar busy'; clearTimeout(saveTimer); saveTimer=setTimeout(doSave,1500); }
async function doSave(){ if(saving){ queueSave(); return; } saving=true; dirty=false;
  try{ const r=await api('saveDesign',{fieldId:regSel.id,design:serDesign(),baseVer:designVer}); designVer=r.ver; DESIGNED[regSel.id]=new Date().toISOString(); $('savebar').textContent='保存済 '+new Date().toTimeString().slice(0,5); $('savebar').className='savebar'; }
  catch(e){ $('savebar').textContent='保存失敗：'+e.message; $('savebar').className='savebar err'; }
  finally{ saving=false; if(dirty) queueSave(); } }
window.addEventListener('beforeunload',e=>{ if(dirty||saving){ e.preventDefault(); e.returnValue=''; } });

// ===== 描画 =====
let lays=[];
function render(save){
  if(save!==false) queueSave();
  const minlen=+$('minlen').value, sp=+$('sp').value/100, fertRate=+$('fert').value, dwid=+$('dw').value/100;
  const z=zones[selZ];
  $('zedit').hidden=!z;
  if(z){ document.querySelectorAll('#machine button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===z.machine)); const m=MACHINES[z.machine]||MACHINES.futago; $('w').value=z.w; $('p').value=z.p; $('w').disabled=$('p').disabled=m.lock||locked; $('w-note').textContent=m.note; $('zang').value=z.ang; $('zang').disabled=locked; }
  $('lock').setAttribute('aria-pressed',locked); $('lock').textContent=locked?'🔒 ロック中':'🔓 編集中';
  ['m-main','m-head','m-dA','m-dB','m-ridge','snap','reset'].forEach(id=>{ $(id).disabled=locked; }); $('z-rect').disabled=locked;
  $('del').disabled=locked||!(selZ>=0||selD>=0);
  MODES.forEach(k=>$('m-'+k).setAttribute('aria-pressed',mode===k)); $('snap').setAttribute('aria-pressed',snapOn);
  $('d-done').hidden=!(mode==='dA'||mode==='dB'); $('d-done').disabled=drawPts.length<2;
  $('labels').setAttribute('aria-pressed',showLabels);
  $('hint').textContent= mode==='main'||mode==='head' ? `${mode==='main'?'本畝':'枕畝'}：角を4つ順にタップ（${drawPts.length}/4）。1→2の向きに畝が走る。`
    : mode==='dA'||mode==='dB' ? `明渠（畝立て${mode==='dA'?'前':'後'}）：線を順にタップして、左の「線を確定」（${drawPts.length}点）。`
    : locked ? 'ロック中。図形は動かない。ドラッグで移動、ピンチ／ホイールで拡大。直すときは上の🔒を押す。' : '編集中。畝タップでオン／オフ、点はドラッグ。終わったら上の🔓でロック。';
  lays=zones.map(zz=>layoutZone(zz,minlen,sp,dwid));
  let nM=0,lenM=0,nH=0,lenH=0,plants=0,pieces=0,skipped=0,manualOff=0;
  lays.forEach((L,i)=>{ const kind=zones[i].kind; for(const r of L.ridges){ if(r.ok){ if(kind==='main') nM++; else nH++; for(const pc of r.pieces){ if(kind==='main') lenM+=pc.len; else lenH+=pc.len; plants+=pc.plants; pieces++; } } else if(!r.auto) skipped++; else manualOff++; } });
  const dTotal=ditches.reduce((s,d)=>s+plen(d.pts),0); const A=Math.abs(area(POLY));
  $('s-area').textContent=(A/100).toFixed(1); $('s-n').textContent=nM; $('s-len').textContent=Math.round(lenM).toLocaleString();
  $('s-hn').textContent=nH; $('s-hlen').textContent=Math.round(lenH).toLocaleString(); $('s-ditch').textContent=Math.round(dTotal).toLocaleString();
  $('s-mulch').textContent=Math.ceil((lenM+lenH+pieces*2)/(+SETTINGS['マルチ巻m']||200)); $('s-plants').textContent=plants.toLocaleString(); $('s-fert').textContent=Math.round(A/1000*fertRate);
  $('skipnote').textContent=(skipped?`最短畝未満で自動オフ ${skipped}本。`:'')+(manualOff?`手動オフ ${manualOff}本。`:'')+'マルチは区間ごとに両端1m余裕込み。';
  const MN={futago:'ふたごちゃん',koune:'こうねちゃん',daichi:'だい地くん'};
  $('zlist').innerHTML=zones.map((zz,i)=>{ const L=lays[i]; const ok=L.ridges.filter(r=>r.ok); const ls=ok.map(r=>r.len); const mn=ls.length?Math.min(...ls):0,mx=ls.length?Math.max(...ls):0;
    return `<div class="zrow" data-i="${i}" aria-pressed="${i===selZ}"><span class="sw" style="background:var(--${zz.kind})"></span><span>${zz.kind==='main'?'本畝':'枕畝'} ${i+1}　<b>${ok.length}本</b><br><small>${MN[zz.machine]||''} ${zz.w}/${zz.p}　余り ${Math.round(Math.abs(L.rest)*100)}cm</small></span><span class="m">${mn.toFixed(0)}〜${mx.toFixed(0)}m</span></div>`; }).join('') || '<p class="skip-note">まだない。🔓にして、左の「本畝」「枕畝」を押し、図の上で4つの角をタップ。</p>';
  $('zlist').querySelectorAll('.zrow').forEach(el=>el.onclick=()=>{ selZ=+el.dataset.i; selD=-1; render(false); });
  let html='';
  zones.forEach((zz,i)=>{ const L=lays[i]; html+=`<tr class="z"><td colspan="3">${zz.kind==='main'?'本畝':'枕畝'} ${i+1}（${MN[zz.machine]||''} ${zz.w}/${zz.p}）</td></tr>`;
    html+=L.ridges.map(r=>r.pieces.map((pc,pi)=>`<tr class="${r.ok?'':'skip'}"><td>${r.ok?(r.no+(r.pieces.length>1?'-'+(pi+1):'')):(r.auto?'オフ':'短')}</td><td>${pc.len.toFixed(1)}</td><td>${r.ok?pc.plants:'–'}</td></tr>`).join('')).join(''); });
  ditches.forEach((d,i)=>{ html+=`<tr class="z"><td colspan="3">明渠 ${i+1}（畝立て${d.when==='A'?'前':'後'}）　${plen(d.pts).toFixed(1)}m</td></tr>`; });
  $('tbl').tBodies[0].innerHTML=html;
  planOv&&planOv.redraw();
}
function drawPlan({P,k}){
  const dwid=+$('dw').value/100; const Pp=poly=>poly.map(([x,y])=>{const q=P(x,y);return `${q[0].toFixed(1)},${q[1].toFixed(1)}`;}).join(' ');
  const LN=(p1,p2,attrs)=>{ const a=P(p1[0],p1[1]),b=P(p2[0],p2[1]); return `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" ${attrs}/>`; };
  let s=`<polygon class="field-hit" points="${Pp(POLY)}" fill="rgba(255,255,255,.08)" stroke="#fff" stroke-width="4"/><polygon points="${Pp(POLY)}" fill="none" stroke="#e23d28" stroke-width="2"/>`;
  if(showLabels){ const sgn=area(POLY)>0?1:-1; for(let i=0;i<POLY.length;i++){ const a=POLY[i],b=POLY[(i+1)%POLY.length]; const L=Math.hypot(b[0]-a[0],b[1]-a[1]); if(L<4) continue; const nx=-sgn*(b[1]-a[1])/L, ny=sgn*(b[0]-a[0])/L; const m=P((a[0]+b[0])/2-nx*0,(a[1]+b[1])/2); const q=P((a[0]+b[0])/2,(a[1]+b[1])/2); const lx=q[0]-nx*14, ly=q[1]-ny*14;
    s+=`<text x="${lx.toFixed(1)}" y="${(ly+3.5).toFixed(1)}" font-size="10" text-anchor="middle" fill="#ffd9d0" font-family="var(--mono)" paint-order="stroke" stroke="#7a1d10" stroke-width="2.5">${L.toFixed(1)}</text>`; } }
  zones.forEach((zz,i)=>{ const L=lays[i]; if(!L) return; const isSel=i===selZ; const sw=Math.max(2,L.w*k); const col=zz.kind==='main'?'var(--main)':'var(--head)';
    s+=`<polygon class="zone-hit hit" data-i="${i}" points="${Pp(zz.pts)}" fill="rgba(255,255,255,.04)" stroke="${isSel?'var(--sel)':col}" stroke-width="${isSel?3:1.5}" stroke-dasharray="${isSel?'':'6 4'}" style="cursor:pointer"/>`;
    const every=Math.max(1,Math.ceil(16/(L.pitch*k)));
    for(const r of L.ridges){ for(const pc of r.pieces){
      s+=LN(pc.p1,pc.p2,`stroke="#fff" stroke-width="${(sw+2).toFixed(1)}" opacity=".6"`);
      s+=LN(pc.p1,pc.p2,`stroke="${r.ok?col:'var(--off)'}" stroke-width="${sw.toFixed(1)}" opacity="${r.ok?1:.5}"`);
      if(mode==='ridge'&&!locked) s+=LN(pc.p1,pc.p2,`class="ridge-hit hit" data-z="${i}" data-col="${r.col}" stroke="transparent" stroke-width="${Math.max(sw,9).toFixed(1)}" style="cursor:pointer"`); }
      if(showLabels && r.ok && r.pieces.length && (r.col%every===0)){ const pc=r.pieces[0]; const q=P((pc.p1[0]+pc.p2[0])/2,(pc.p1[1]+pc.p2[1])/2);
        s+=`<text x="${q[0].toFixed(1)}" y="${(q[1]+3.5).toFixed(1)}" font-size="10" text-anchor="middle" fill="#fff" font-family="var(--mono)" paint-order="stroke" stroke="#000" stroke-width="2.5">${r.len.toFixed(0)}m</text>`; } }
    { const [q0,q1,q2,q3]=zz.pts; const span=L.n?(L.w+(L.n-1)*L.pitch):0; const okN=L.ridges.filter(r=>r.ok).length; const mx=(q1[0]+q2[0])/2,my=(q1[1]+q2[1])/2; const cx=(q0[0]+q1[0]+q2[0]+q3[0])/4,cy=(q0[1]+q1[1]+q2[1]+q3[1])/4; const a=P(mx,my),c=P(cx,cy); const dx=a[0]-c[0],dy=a[1]-c[1]; const dl=Math.hypot(dx,dy)||1;
      s+=`<text x="${(a[0]+dx/dl*14).toFixed(1)}" y="${(a[1]+dy/dl*14+3.5).toFixed(1)}" font-size="11" font-weight="700" text-anchor="middle" fill="#fff" font-family="var(--mono)" paint-order="stroke" stroke="${zz.kind==='main'?'#0b4a22':'#7a3d00'}" stroke-width="3">${okN}本 / 幅${span.toFixed(1)}m</text>`; }
    if(!locked&&mode==='ridge') zz.pts.forEach((pt,pi)=>{ const q=P(pt[0],pt[1]); s+=`<circle class="zpt hit" data-z="${i}" data-i="${pi}" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${isSel?10:7}" fill="#fff" stroke="${isSel?'var(--sel)':col}" stroke-width="${isSel?3:2}" style="cursor:move"/>`; if(isSel) s+=`<text x="${q[0].toFixed(1)}" y="${(q[1]+3.5).toFixed(1)}" font-size="10" font-weight="700" text-anchor="middle" fill="#000">${pi+1}</text>`; });
  });
  ditches.forEach((d,i)=>{ const isSel=i===selD; const col=d.when==='A'?'var(--ditchA)':'var(--ditchB)'; const dsw=Math.max(3,dwid*k);
    s+=`<polyline points="${Pp(d.pts)}" fill="none" stroke="#fff" stroke-width="${(dsw+3).toFixed(1)}" opacity=".7"/><polyline points="${Pp(d.pts)}" fill="none" stroke="${col}" stroke-width="${dsw.toFixed(1)}" stroke-dasharray="${d.when==='B'?'10 5':''}"/>`;
    s+=`<polyline class="ditch-hit hit" data-i="${i}" points="${Pp(d.pts)}" fill="none" stroke="transparent" stroke-width="16" style="cursor:pointer"/>`;
    const j=Math.floor((d.pts.length-1)/2); const mid=d.pts[j], nxt=d.pts[Math.min(d.pts.length-1,j+1)]; const q=P((mid[0]+nxt[0])/2,(mid[1]+nxt[1])/2);
    s+=`<text x="${q[0].toFixed(1)}" y="${(q[1]-8).toFixed(1)}" font-size="11" text-anchor="middle" fill="#fff" font-family="var(--mono)" paint-order="stroke" stroke="#000" stroke-width="2.5">明渠${d.when==='A'?'前':'後'} ${plen(d.pts).toFixed(0)}m</text>`;
    if(!locked&&mode==='ridge') d.pts.forEach((pt,pi)=>{ const q=P(pt[0],pt[1]); s+=`<circle class="dpt hit" data-d="${i}" data-i="${pi}" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${isSel?9:6}" fill="#fff" stroke="${isSel?'var(--sel)':col}" stroke-width="${isSel?3:2}" style="cursor:move"/>`; });
  });
  if(drawPts.length){ const col=mode==='main'?'var(--main)':mode==='head'?'var(--head)':mode==='dA'?'var(--ditchA)':'var(--ditchB)';
    s+=`<polyline points="${Pp(drawPts)}" fill="none" stroke="${col}" stroke-width="2.5" stroke-dasharray="5 4"/>`;
    drawPts.forEach((pt,pi)=>{ const q=P(pt[0],pt[1]); s+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="7" fill="${col}" stroke="#fff" stroke-width="2"/><text x="${q[0].toFixed(1)}" y="${(q[1]+3.5).toFixed(1)}" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">${pi+1}</text>`; });
    if((mode==='main'||mode==='head')&&drawPts.length>=2){ const [a,b]=drawPts; const L=Math.hypot(b[0]-a[0],b[1]-a[1]); const q=P((a[0]+b[0])/2,(a[1]+b[1])/2); s+=`<text x="${q[0].toFixed(1)}" y="${(q[1]-8).toFixed(1)}" font-size="11" text-anchor="middle" fill="#fff" font-family="var(--mono)" paint-order="stroke" stroke="#000" stroke-width="2.5">畝の向き ${L.toFixed(0)}m</text>`; } }
  return s;
}
